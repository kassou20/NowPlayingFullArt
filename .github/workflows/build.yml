name: Build Dylib

on:
  workflow_dispatch:
  push:
    paths:
      - "Sources/**"
      - "build.sh"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Choose latest Xcode
        run: |
          latest_xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Selected: $latest_xcode"
          sudo xcode-select --switch "$latest_xcode"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile dylib
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowPlayingFullArt
          path: out/*.dylib
          if-no-files-found: error
